<script>
    var i=1;
    while (i >= 6);
    var aa = parseInt(prompt( "entre com o ano atual"))
    var an = parseInt(prompt( "entre com o ano nascimento"))
    var id = ( aa - an )
    document.write( "a idade e " + id + "<br>")
    if (id >= 18) {
        document.write (" Maior ")
    } else {
        document.write (" Menor ")
    }
    i = i + 1
</script>
